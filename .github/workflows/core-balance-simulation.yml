name: Core Balance Simulation

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'app/src/main/java/com/steamforge/game/core/**'
      - 'app/src/test/java/com/steamforge/game/core/GameBalanceSimulationTest.kt'
      - '.github/workflows/core-balance-simulation.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'app/src/main/java/com/steamforge/game/core/**'
      - 'app/src/test/java/com/steamforge/game/core/GameBalanceSimulationTest.kt'
      - '.github/workflows/core-balance-simulation.yml'

permissions:
  contents: read

concurrency:
  group: core-balance-simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android 36 packages
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Run deterministic core simulations
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests com.steamforge.game.core.GameBalanceSimulationTest
          --stacktrace --no-daemon

      - name: Publish balance summaries
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="$(find app/build -path '*/steamforge-balance/core-baseline.json' -type f -print -quit)"
          SENSITIVITY="$(find app/build -path '*/steamforge-balance/spawn-sensitivity.json' -type f -print -quit)"
          test -n "$BASELINE"
          test -n "$SENSITIVITY"
          echo "Baseline report: $BASELINE"
          cat "$BASELINE"
          echo "Spawn sensitivity report: $SENSITIVITY"
          cat "$SENSITIVITY"
          mkdir -p balance-report
          cp "$BASELINE" balance-report/core-baseline.json
          cp "$SENSITIVITY" balance-report/spawn-sensitivity.json

      - name: Upload core balance baseline
        uses: actions/upload-artifact@v4
        with:
          name: steamforge-core-balance-baseline
          path: balance-report/core-baseline.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload spawn sensitivity report
        uses: actions/upload-artifact@v4
        with:
          name: steamforge-spawn-sensitivity
          path: balance-report/spawn-sensitivity.json
          if-no-files-found: error
          retention-days: 30
