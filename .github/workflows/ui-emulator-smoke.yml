name: UI Emulator Smoke

on:
  push:
    branches: ['ci/ui-emulator-smoke']
    paths-ignore:
      - 'ci-screenshots/**'

permissions:
  contents: write

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install emulator packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'emulator' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'system-images;android-36;google_apis;x86_64'

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Create and boot emulator
        run: |
          ls -l /dev/kvm || true
          sudo chmod 666 /dev/kvm || true
          echo no | avdmanager create avd \
            -n steamforge_ci \
            -k 'system-images;android-36;google_apis;x86_64' \
            -d pixel_6 \
            --force
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd steamforge_ci \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            -accel on \
            -camera-back none \
            -camera-front none \
            > emulator.log 2>&1 &
          echo $! > emulator.pid
          adb start-server
          timeout 180 adb wait-for-device
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then
              echo 'Emulator process exited early'
              cat emulator.log
              exit 1
            fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0.5
          adb shell settings put global transition_animation_scale 0.5
          adb shell settings put global animator_duration_scale 0.5
          adb shell wm size 1080x2400
          adb shell wm density 420

      - name: Install and launch Steamforge
        run: |
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell am force-stop com.steamforge.game
          adb shell monkey -p com.steamforge.game -c android.intent.category.LAUNCHER 1
          sleep 3

      - name: Capture real UI screens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-screenshots

          tap_node() {
            local needle="$1"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
            python3 -c 'import re,sys,xml.etree.ElementTree as ET; n=sys.argv[1].casefold(); nodes=[x for x in ET.parse("/tmp/window.xml").getroot().iter("node") if n in (((x.attrib.get("text") or "")+" "+(x.attrib.get("content-desc") or "")).casefold())]; assert nodes, "node not found: "+n; m=re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", nodes[0].attrib.get("bounds", "")); assert m, "bounds missing"; a=list(map(int,m.groups())); print((a[0]+a[2])//2, (a[1]+a[3])//2)' "$needle" > /tmp/tap.txt
            read -r x y < /tmp/tap.txt
            adb shell input tap "$x" "$y"
            sleep 2
          }

          shot() {
            adb exec-out screencap -p > "ci-screenshots/$1.png"
          }

          tap_node 'Отключить'
          shot '01-workshop'

          tap_node 'ИГРАТЬ'
          shot '02-game'
          adb shell input keyevent KEYCODE_BACK
          sleep 2

          tap_node 'ДОСТИЖЕНИЯ'
          shot '03-achievements'
          adb shell input keyevent KEYCODE_BACK
          sleep 2

          tap_node 'НАСТРОЙКИ'
          shot '04-settings'

          adb shell uiautomator dump /sdcard/window.xml >/dev/null || true
          adb pull /sdcard/window.xml ci-screenshots/last-window.xml >/dev/null || true

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: steamforge-real-ui
          path: ci-screenshots/
          if-no-files-found: error
          retention-days: 3

      - name: Publish screenshots to smoke branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-screenshots/*.png ci-screenshots/last-window.xml
          if ! git diff --cached --quiet; then
            git commit -m 'ci: capture real emulator UI screenshots'
            git push
          fi

      - name: Emulator diagnostics on failure
        if: failure()
        run: |
          echo '=== emulator.log ==='
          tail -400 emulator.log || true
          echo '=== adb devices ==='
          adb devices -l || true
          echo '=== UI hierarchy ==='
          adb shell uiautomator dump /sdcard/window.xml || true
          adb pull /sdcard/window.xml - || true
