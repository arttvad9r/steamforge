name: Apply V1 Gameplay Clean Transform

on:
  push:
    branches:
      - visual/v1-gameplay-clean-pass
    paths:
      - 'tools/apply-v1-gameplay-clean.py'
      - '.github/workflows/apply-v1-gameplay-clean.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-v1-gameplay-clean
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout visual branch
        uses: actions/checkout@v6
        with:
          ref: visual/v1-gameplay-clean-pass
          fetch-depth: 0

      - name: Apply deterministic transform
        run: python3 tools/apply-v1-gameplay-clean.py

      - name: Commit transformed gameplay UI
        run: |
          if git diff --quiet -- app/src/main/java/com/steamforge/game/ui/game/GameScreen.kt; then
            echo 'No gameplay diff to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/steamforge/game/ui/game/GameScreen.kt
          git commit -m 'visual: clean V1 gameplay chrome'
          git push origin HEAD:visual/v1-gameplay-clean-pass
