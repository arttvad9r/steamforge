name: Terminal Retry Patch

on:
  push:
    branches:
      - feature/terminal-finish-retry
    paths:
      - '.github/workflows/terminal-retry-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/terminal-finish-retry
          fetch-depth: 0
      - name: Apply terminal retry hardening
        run: python3 .github/terminal-retry-patch.py
      - name: Commit product changes
        run: |
          git diff --check
          git config user.name 'steamforge-ci'
          git config user.email 'steamforge-ci@users.noreply.github.com'
          git add app/src/main/java/com/steamforge/game/ui/game/GameViewModel.kt
          git add app/src/main/java/com/steamforge/game/ui/game/GameScreen.kt
          git add app/src/test/java/com/steamforge/game/ui/game/LowStoragePersistenceTest.kt
          git commit -m 'fix: retry terminal finish persistence'
          git push origin HEAD:feature/terminal-finish-retry
