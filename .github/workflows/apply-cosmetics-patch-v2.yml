name: Apply Cosmetics Wiring Patch V2

on:
  push:
    branches:
      - feature/cosmetics
    paths:
      - '.github/workflows/apply-cosmetics-patch-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cosmetics
          fetch-depth: 0

      - name: Reuse targeted patch with normalized anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/apply-cosmetics-patch.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          git diff --check"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = source[start:end]
          lines = []
          for line in script.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          script = '\n'.join(lines)
          script = script.replace("must be a valid URI scheme' '''", "must be a valid URI scheme'''" )
          script = script.replace(
              "'''import com.steamforge.game.sound.Sfx'''",
              "'''import com.steamforge.game.sound.Sfx\\n'''",
          )
          script = script.replace(
              "'''import com.steamforge.game.cosmetics.CosmeticCatalog\\nimport com.steamforge.game.sound.Sfx'''",
              "'''import com.steamforge.game.cosmetics.CosmeticCatalog\\nimport com.steamforge.game.sound.Sfx\\n'''",
          )
          script = script.replace(
              "'''    accent: Color,\\n    steamEngineUnlocked: Boolean,\\n) {''',\n    '''    accent: Color,\\n    steamEngineUnlocked: Boolean,\\n    foundryTheme: Boolean,\\n) {''',",
              "'''private fun WorkshopConsole(\\n    level: Int,\\n    levelInfo: com.steamforge.game.progression.LevelInfo,\\n    gamesPlayed: Int,\\n    bestScore: Int,\\n    animationsEnabled: Boolean,\\n    accent: Color,\\n    steamEngineUnlocked: Boolean,\\n) {''',\n    '''private fun WorkshopConsole(\\n    level: Int,\\n    levelInfo: com.steamforge.game.progression.LevelInfo,\\n    gamesPlayed: Int,\\n    bestScore: Int,\\n    animationsEnabled: Boolean,\\n    accent: Color,\\n    steamEngineUnlocked: Boolean,\\n    foundryTheme: Boolean,\\n) {''',",
              1,
          )
          compile(script, 'cosmetics-wiring.py', 'exec')
          exec(script, {'__name__': '__main__'})
          PY

          git diff --check
          # GITHUB_TOKEN may not update workflow files without the workflows permission.
          # Keep the android-ci guard change for a separate connector commit.
          git checkout -- .github/workflows/android-ci.yml
          git config user.name "steamforge-ci"
          git config user.email "steamforge-ci@users.noreply.github.com"
          git add app tools
          git commit -m "feat: wire cosmetic purchases and visual themes"
          git push origin HEAD:feature/cosmetics
