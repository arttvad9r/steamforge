name: Gameplay Overlay Landscape Diagnostic

on:
  push:
    branches:
      - diag/gameplay-overlay-adaptive-capture-v1

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install emulator packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-36' 'build-tools;36.0.0' 'system-images;android-36;google_apis;x86_64'
      - name: Expose production overlays to diagnostic test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/steamforge/game/ui/game/GameScreen.kt')
          text = path.read_text()
          game_over = '@Composable\nprivate fun GameOverOverlay('
          core = '@Composable\nprivate fun CoreOnlineOverlay('
          assert game_over in text
          assert core in text
          text = text.replace(game_over, '@Composable\nfun GameOverOverlay(', 1)
          text = text.replace(core, '@Composable\nfun CoreOnlineOverlay(', 1)
          path.write_text(text)
          PY
      - name: Build debug and instrumentation APKs
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Boot emulator
        run: |
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/16.0/bin/avdmanager" create avd -n overlay_landscape_v1 -k 'system-images;android-36;google_apis;x86_64' -d pixel_6 --force
          ANDROID_AVD_HOME="$ANDROID_AVD_HOME" nohup "$ANDROID_HOME/emulator/emulator" -avd overlay_landscape_v1 -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > emulator.log 2>&1 &
          adb start-server
          for i in $(seq 1 120); do adb devices | grep -q '^emulator-' && break; sleep 2; done
          for i in $(seq 1 120); do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break; sleep 2; done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Install APKs
        run: |
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Capture landscape overlays
        shell: bash
        run: |
          set -euo pipefail
          adb shell wm size 1280x720
          adb shell wm density 320
          capture() {
            local suffix="$1" font="$2"
            adb shell settings put system font_scale "$font"
            adb shell am instrument -w -r -e class com.steamforge.game.ui.game.GameplayOverlayLandscapeDiagnosticTest com.steamforge.game.test/androidx.test.runner.AndroidJUnitRunner | tee "overlay-${suffix}.txt"
            grep -F 'OK (2 tests)' "overlay-${suffix}.txt"
            adb exec-out run-as com.steamforge.game cat cache/game-over-landscape.png > "game-over-landscape-${suffix}.png"
            adb exec-out run-as com.steamforge.game cat cache/core-online-landscape.png > "core-online-landscape-${suffix}.png"
            test -s "game-over-landscape-${suffix}.png"
            test -s "core-online-landscape-${suffix}.png"
          }
          capture standard 1.0
          capture large-text 1.3
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steamforge-gameplay-overlay-landscape-v1
          path: |
            game-over-landscape-*.png
            core-online-landscape-*.png
            overlay-*.txt
            emulator.log
          if-no-files-found: warn
          retention-days: 3
