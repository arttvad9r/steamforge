name: Finish Recovery Patch

on:
  push:
    branches:
      - feature/finish-persistence-recovery
    paths:
      - '.github/workflows/finish-recovery-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/finish-persistence-recovery
          fetch-depth: 0
      - name: Apply recovery patch
        run: python3 .github/finish-recovery-patch.py
      - name: Commit product changes
        run: |
          git diff --check
          git config user.name 'steamforge-ci'
          git config user.email 'steamforge-ci@users.noreply.github.com'
          git add app/src/main/java/com/steamforge/game/ui/game/GameViewModel.kt
          git add app/src/main/java/com/steamforge/game/ui/game/GameScreen.kt
          git add app/src/test/java/com/steamforge/game/ui/game/FinishPersistenceRetryTest.kt
          git commit -m 'fix: protect terminal persistence recovery'
          git push origin HEAD:feature/finish-persistence-recovery
