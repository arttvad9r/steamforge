name: RuStore Store Assets

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'app/src/main/java/com/steamforge/game/MainActivity.kt'
      - 'app/src/main/java/com/steamforge/game/Navigation.kt'
      - 'app/src/main/java/com/steamforge/game/theme/**'
      - 'app/src/main/java/com/steamforge/game/ui/**'
      - '.github/workflows/rustore-store-assets.yml'

permissions:
  contents: read

concurrency:
  group: rustore-store-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install emulator packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'emulator' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'system-images;android-36;google_apis;x86_64'

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Boot 9:16 emulator
        run: |
          set -euxo pipefail
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/avdmanager"
          echo no | "$AVDMANAGER" create avd \
            -n steamforge_store \
            -k 'system-images;android-36;google_apis;x86_64' \
            -d pixel_6 \
            --force
          ANDROID_AVD_HOME="$ANDROID_AVD_HOME" nohup "$ANDROID_HOME/emulator/emulator" \
            -avd steamforge_store \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel on \
            -camera-back none \
            -camera-front none \
            > emulator.log 2>&1 &
          echo $! > emulator.pid
          adb start-server
          for i in $(seq 1 120); do
            if adb devices | grep -q '^emulator-'; then break; fi
            sleep 2
          done
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then break; fi
            if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then cat emulator.log; exit 1; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0.5
          adb shell settings put global transition_animation_scale 0.5
          adb shell settings put global animator_duration_scale 0.5
          adb shell settings put secure immersive_mode_confirmations confirmed || true
          adb shell wm size 1080x1920
          adb shell wm density 360

      - name: Install and launch fullscreen capture mode
        run: |
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell am force-stop com.steamforge.game
          adb shell am start -W \
            -n com.steamforge.game/.MainActivity \
            --ez store_screenshot true

      - name: Capture store screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p store-screenshots

          dump_ui() {
            for i in $(seq 1 15); do
              adb shell rm -f /sdcard/window.xml >/dev/null 2>&1 || true
              rm -f /tmp/window.xml
              if adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 \
                && adb pull /sdcard/window.xml /tmp/window.xml >/dev/null 2>&1 \
                && [ -s /tmp/window.xml ]; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          dismiss_immersive_confirmation() {
            for i in $(seq 1 5); do
              if ! dump_ui; then
                sleep 1
                continue
              fi
              if grep -Fq 'com.android.systemui:id/ok' /tmp/window.xml || grep -Fqi 'Got it' /tmp/window.xml; then
                python3 - <<'PY' > /tmp/immersive-tap.txt
          import re
          import xml.etree.ElementTree as ET

          root = ET.parse('/tmp/window.xml').getroot()
          node = next(
              n for n in root.iter('node')
              if n.attrib.get('resource-id') == 'com.android.systemui:id/ok'
              or (n.attrib.get('text') or '').casefold() == 'got it'
          )
          match = re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib['bounds'])
          assert match
          left, top, right, bottom = map(int, match.groups())
          print((left + right) // 2, (top + bottom) // 2)
          PY
                read -r x y < /tmp/immersive-tap.txt
                adb shell input tap "$x" "$y"
                sleep 1
                return 0
              fi
              return 0
            done
          }

          wait_for_text() {
            local needle="$1"
            for i in $(seq 1 15); do
              if dump_ui && grep -Fqi "$needle" /tmp/window.xml; then return 0; fi
              sleep 2
            done
            echo "Text not found: $needle"
            cat /tmp/window.xml || true
            return 1
          }

          wait_for_tile() {
            for i in $(seq 1 15); do
              if dump_ui && grep -Eqi 'content-desc="(Уголь|Медная шестерня),' /tmp/window.xml; then return 0; fi
              sleep 2
            done
            echo 'Initial game tile not found'
            cat /tmp/window.xml || true
            return 1
          }

          tap_node() {
            local needle="$1"
            dump_ui
            python3 -c 'import re,sys,xml.etree.ElementTree as ET; n=sys.argv[1].casefold(); root=ET.parse("/tmp/window.xml").getroot(); parents={c:p for p in root.iter() for c in p}; matches=[x for x in root.iter("node") if n in (((x.attrib.get("text") or "")+" "+(x.attrib.get("content-desc") or "")).casefold())]; assert matches, "node not found: "+n; original=matches[0]; node=next((a for a in [original, parents.get(original), parents.get(parents.get(original)) if parents.get(original) is not None else None] if a is not None and a.attrib.get("clickable")=="true"), original); m=re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", node.attrib.get("bounds", "")); assert m; a=list(map(int,m.groups())); print((a[0]+a[2])//2,(a[1]+a[3])//2)' "$needle" > /tmp/tap.txt
            read -r x y < /tmp/tap.txt
            adb shell input tap "$x" "$y"
            sleep 1
          }

          shot() {
            adb exec-out screencap -p > "store-screenshots/$1"
            test -s "store-screenshots/$1"
          }

          dismiss_immersive_confirmation
          wait_for_text 'ПРИВАТНОСТЬ'
          if grep -Fqi 'ОТКЛЮЧИТЬ' /tmp/window.xml; then tap_node 'ОТКЛЮЧИТЬ'; fi
          wait_for_text 'ИГРАТЬ'
          sleep 1
          shot '02-workshop-1080x1920.png'

          tap_node 'ИГРАТЬ'
          wait_for_tile

          # Make the marketing gameplay frame representative instead of showing only two spawn tiles.
          for i in $(seq 1 4); do
            adb shell input swipe 820 1150 260 1150 140
            adb shell input swipe 540 1350 540 760 140
            adb shell input swipe 260 1150 820 1150 140
            adb shell input swipe 540 760 540 1350 140
          done
          sleep 2
          shot '01-game-1080x1920.png'

          adb shell input keyevent KEYCODE_BACK
          wait_for_text 'ДОСТИЖЕНИЯ'
          tap_node 'ДОСТИЖЕНИЯ'
          wait_for_text 'ПРОГРЕСС'
          sleep 1
          shot '03-achievements-1080x1920.png'

          python3 - <<'PY'
          import struct
          from pathlib import Path

          expected = (1080, 1920)
          paths = sorted(Path('store-screenshots').glob('*.png'))
          if len(paths) != 3:
              raise SystemExit(f'expected 3 screenshots, got {len(paths)}')
          for path in paths:
              data = path.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{path}: not PNG')
              size = struct.unpack('>II', data[16:24])
              print(f'{path}: {size[0]}x{size[1]}')
              if size != expected:
                  raise SystemExit(f'{path}: expected 1080x1920')
          PY

      - name: Upload RuStore screenshots
        uses: actions/upload-artifact@v4
        with:
          name: steamforge-rustore-screenshots
          path: store-screenshots/
          if-no-files-found: error
          retention-days: 14

      - name: Emulator diagnostics on failure
        if: failure()
        run: |
          tail -400 emulator.log || true
          adb devices -l || true
          adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || true
