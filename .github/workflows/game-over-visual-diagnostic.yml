name: Game Over Visual Diagnostic

on:
  push:
    branches:
      - diag/game-over-result-v1

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install emulator packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'emulator' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'system-images;android-36;google_apis;x86_64'

      - name: Prepare diagnostic test source
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          game = Path('app/src/main/java/com/steamforge/game/ui/game/GameScreen.kt')
          text = game.read_text()
          needle = '@Composable\nprivate fun GameOverOverlay('
          assert needle in text, 'GameOverOverlay visibility marker not found'
          game.write_text(text.replace(needle, '@Composable\nfun GameOverOverlay(', 1))
          test = base64.b64decode(' ').decode()
          path = Path('app/src/androidTest/java/com/steamforge/game/ui/game/GameOverResultOverlayDiagnosticTest.kt')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(test)
          PY

      - name: Build debug and diagnostic APKs
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest

      - name: Create and boot emulator
        run: |
          set -euxo pipefail
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/avdmanager"
          test -x "$AVDMANAGER"
          echo no | "$AVDMANAGER" create avd \
            -n steamforge_game_over_ci \
            -k 'system-images;android-36;google_apis;x86_64' \
            -d pixel_6 \
            --force
          ANDROID_AVD_HOME="$ANDROID_AVD_HOME" nohup "$ANDROID_HOME/emulator/emulator" \
            -avd steamforge_game_over_ci \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel on \
            -camera-back none \
            -camera-front none \
            > emulator.log 2>&1 &
          echo $! > emulator.pid
          adb start-server
          for i in $(seq 1 120); do
            if adb devices | grep -q '^emulator-'; then break; fi
            if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then cat emulator.log; exit 1; fi
            sleep 2
          done
          adb devices | grep '^emulator-'
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then break; fi
            if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then cat emulator.log; exit 1; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Install debug and instrumentation APKs
        run: |
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Capture standard Game Over variants
        shell: bash
        run: |
          set -euo pipefail
          adb shell wm size 1080x2400
          adb shell wm density 420
          adb shell settings put system font_scale 1.0
          adb shell am instrument -w -r \
            -e class com.steamforge.game.ui.game.GameOverResultOverlayDiagnosticTest \
            com.steamforge.game.test/androidx.test.runner.AndroidJUnitRunner \
            | tee game-over-standard-instrumentation.txt
          grep -F 'OK (2 tests)' game-over-standard-instrumentation.txt
          adb exec-out run-as com.steamforge.game cat cache/game-over-dense.png > game-over-standard.png
          adb exec-out run-as com.steamforge.game cat cache/game-over-basic.png > game-over-basic.png
          test -s game-over-standard.png
          test -s game-over-basic.png

      - name: Capture compact dense result
        shell: bash
        run: |
          set -euo pipefail
          adb shell wm size 720x1600
          adb shell wm density 320
          adb shell settings put system font_scale 1.0
          adb shell am instrument -w -r \
            -e class 'com.steamforge.game.ui.game.GameOverResultOverlayDiagnosticTest#denseResultRendersGameplayFirstHierarchy' \
            com.steamforge.game.test/androidx.test.runner.AndroidJUnitRunner \
            | tee game-over-compact-instrumentation.txt
          grep -F 'OK (1 test)' game-over-compact-instrumentation.txt
          adb exec-out run-as com.steamforge.game cat cache/game-over-dense.png > game-over-compact.png
          test -s game-over-compact.png

      - name: Capture large-text dense result
        shell: bash
        run: |
          set -euo pipefail
          adb shell wm size 1080x2400
          adb shell wm density 420
          adb shell settings put system font_scale 1.3
          adb shell am instrument -w -r \
            -e class 'com.steamforge.game.ui.game.GameOverResultOverlayDiagnosticTest#denseResultRendersGameplayFirstHierarchy' \
            com.steamforge.game.test/androidx.test.runner.AndroidJUnitRunner \
            | tee game-over-large-text-instrumentation.txt
          grep -F 'OK (1 test)' game-over-large-text-instrumentation.txt
          adb exec-out run-as com.steamforge.game cat cache/game-over-dense.png > game-over-large-text.png
          test -s game-over-large-text.png

      - name: Verify PNG outputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'game-over-standard.png',
              'game-over-basic.png',
              'game-over-compact.png',
              'game-over-large-text.png',
          ]:
              data = Path(name).read_bytes()
              assert data.startswith(b'\x89PNG\r\n\x1a\n'), f'{name} is not a PNG'
              print(name, len(data))
          PY

      - name: Upload Game Over screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steamforge-game-over-visual-diagnostic
          path: |
            game-over-standard.png
            game-over-basic.png
            game-over-compact.png
            game-over-large-text.png
            game-over-*-instrumentation.txt
            emulator.log
          if-no-files-found: warn
          retention-days: 3
