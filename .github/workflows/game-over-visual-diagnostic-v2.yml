name: Game Over Visual Diagnostic V2

on:
  push:
    branches:
      - diag/game-over-result-v1

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install emulator packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-36' 'build-tools;36.0.0' 'system-images;android-36;google_apis;x86_64'
      - name: Prepare dense overlay test
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          game = Path('app/src/main/java/com/steamforge/game/ui/game/GameScreen.kt')
          text = game.read_text()
          marker = '@Composable\nprivate fun GameOverOverlay('
          assert marker in text
          game.write_text(text.replace(marker, '@Composable\nfun GameOverOverlay(', 1))
          data = base64.b64decode('')
          path = Path('app/src/androidTest/java/com/steamforge/game/ui/game/GameOverDenseDiagnosticTest.kt')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(data)
          PY
      - name: Build debug and instrumentation APKs
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Boot emulator
        run: |
          set -euxo pipefail
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/16.0/bin/avdmanager" create avd -n game_over_v2 -k 'system-images;android-36;google_apis;x86_64' -d pixel_6 --force
          ANDROID_AVD_HOME="$ANDROID_AVD_HOME" nohup "$ANDROID_HOME/emulator/emulator" -avd game_over_v2 -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > emulator.log 2>&1 &
          echo $! > emulator.pid
          adb start-server
          for i in $(seq 1 120); do adb devices | grep -q '^emulator-' && break; sleep 2; done
          for i in $(seq 1 120); do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break; sleep 2; done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Install APKs
        run: |
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Capture standard compact and large text
        shell: bash
        run: |
          set -euo pipefail
          capture() {
            local name="$1" size="$2" density="$3" font="$4"
            adb shell wm size "$size"
            adb shell wm density "$density"
            adb shell settings put system font_scale "$font"
            adb shell am instrument -w -r -e class com.steamforge.game.ui.game.GameOverDenseDiagnosticTest com.steamforge.game.test/androidx.test.runner.AndroidJUnitRunner | tee "${name}.txt"
            grep -F 'OK (1 test)' "${name}.txt"
            adb exec-out run-as com.steamforge.game cat cache/game-over-dense.png > "${name}.png"
            test -s "${name}.png"
          }
          capture game-over-standard 1080x2400 420 1.0
          capture game-over-compact 720x1600 320 1.0
          capture game-over-large-text 1080x2400 420 1.3
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steamforge-game-over-visual-v2
          path: |
            game-over-*.png
            game-over-*.txt
            emulator.log
          if-no-files-found: warn
          retention-days: 3
