name: Apply Workshop Hero Composition V2

on:
  push:
    branches:
      - diag/workshop-hero-composition-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production target
        uses: actions/checkout@v6
        with:
          ref: feat/workshop-hero-composition-v2
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout patch source
        uses: actions/checkout@v6
        with:
          ref: diag/workshop-hero-composition-v2
          path: patch-source
      - name: Apply Workshop hero patch
        shell: bash
        run: |
          python3 patch-source/.github/workshop_hero_patch_v2.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/steamforge/game/ui/workshop/WorkshopScreen.kt
          git commit -m "Refine Workshop hero composition"
          git push origin HEAD:feat/workshop-hero-composition-v2
