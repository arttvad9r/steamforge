name: Frame Timing Diagnostic Smoke

on:
  pull_request:
    paths:
      - 'app/src/main/java/com/steamforge/game/ui/game/**'
      - 'app/src/benchmark/**'
      - 'macrobenchmark/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/frame-timing-diagnostic-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frame-timing-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frame-timing-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install emulator packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'emulator' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'system-images;android-36;google_apis;x86_64'

      - name: Create and boot emulator
        run: |
          set -euxo pipefail
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/avdmanager"
          echo no | "$AVDMANAGER" create avd \
            -n steamforge_benchmark \
            -k 'system-images;android-36;google_apis;x86_64' \
            -d pixel_6 \
            --force
          ANDROID_AVD_HOME="$ANDROID_AVD_HOME" nohup "$ANDROID_HOME/emulator/emulator" \
            -avd steamforge_benchmark \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel on \
            -camera-back none \
            -camera-front none \
            > emulator.log 2>&1 &
          echo $! > emulator.pid
          adb start-server
          for i in $(seq 1 120); do
            if adb devices | grep -q '^emulator-'; then break; fi
            if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then cat emulator.log; exit 1; fi
            sleep 2
          done
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then break; fi
            if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then cat emulator.log; exit 1; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 1
          adb shell settings put global transition_animation_scale 1
          adb shell settings put global animator_duration_scale 1

      - name: Run release-like hosted-emulator frame diagnostic
        run: |
          ./gradlew --no-daemon :macrobenchmark:connectedBenchmarkAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.steamforge.game.macrobenchmark.BoardFrameTimingGfxInfoDiagnostic \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR \
            --stacktrace

      - name: List benchmark outputs
        if: always()
        run: |
          find macrobenchmark/build/outputs -type f -print 2>/dev/null || true
          find macrobenchmark/build/reports -type f -print 2>/dev/null || true

      - name: Upload frame timing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steamforge-frame-timing-diagnostic
          path: |
            macrobenchmark/build/outputs/
            macrobenchmark/build/reports/
          if-no-files-found: warn
          retention-days: 3

      - name: Emulator diagnostics on failure
        if: failure()
        run: |
          echo '=== emulator.log ==='
          tail -400 emulator.log || true
          echo '=== adb devices ==='
          adb devices -l || true
          echo '=== instrumentation ==='
          adb shell dumpsys activity activities | head -200 || true
