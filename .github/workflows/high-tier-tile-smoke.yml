name: High Tier Tile Smoke

on:
  push:
    branches:
      - master
    paths:
      - 'app/src/main/java/com/steamforge/game/theme/**'
      - 'app/src/main/java/com/steamforge/game/ui/game/**'
      - 'app/src/androidTest/java/com/steamforge/game/HighTierBoardReadabilityTest.kt'
      - '.github/workflows/high-tier-tile-smoke.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'app/src/main/java/com/steamforge/game/theme/**'
      - 'app/src/main/java/com/steamforge/game/ui/game/**'
      - 'app/src/androidTest/java/com/steamforge/game/HighTierBoardReadabilityTest.kt'
      - '.github/workflows/high-tier-tile-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: high-tier-tile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  high-tier-readability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install emulator packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'emulator' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'system-images;android-36;google_apis;x86_64'

      - name: Build debug and high-tier instrumentation APKs
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest

      - name: Create and boot emulator
        run: |
          set -euxo pipefail
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/avdmanager"
          test -x "$AVDMANAGER"
          echo no | "$AVDMANAGER" create avd \
            -n steamforge_high_tier_ci \
            -k 'system-images;android-36;google_apis;x86_64' \
            -d pixel_6 \
            --force
          ANDROID_AVD_HOME="$ANDROID_AVD_HOME" nohup "$ANDROID_HOME/emulator/emulator" \
            -avd steamforge_high_tier_ci \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel on \
            -camera-back none \
            -camera-front none \
            > emulator.log 2>&1 &
          echo $! > emulator.pid
          adb start-server
          for i in $(seq 1 120); do
            if adb devices | grep -q '^emulator-'; then break; fi
            if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then cat emulator.log; exit 1; fi
            sleep 2
          done
          adb devices | grep '^emulator-'
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then break; fi
            if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then cat emulator.log; exit 1; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell wm size 1080x2400
          adb shell wm density 420

      - name: Install debug and instrumentation APKs
        run: |
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Verify and capture high-tier board
        shell: bash
        run: |
          set -euo pipefail
          adb shell am instrument -w -r \
            -e class com.steamforge.game.HighTierBoardReadabilityTest \
            com.steamforge.game.test/androidx.test.runner.AndroidJUnitRunner \
            | tee high-tier-instrumentation.txt
          grep -F 'OK (1 test)' high-tier-instrumentation.txt
          adb exec-out run-as com.steamforge.game cat cache/high-tier-board.png > high-tier-board.png
          test -s high-tier-board.png
          python3 - <<'PY'
          from pathlib import Path
          data = Path('high-tier-board.png').read_bytes()
          assert data.startswith(b'\x89PNG\r\n\x1a\n'), 'high-tier-board.png is not a PNG'
          print(f'high-tier-board.png: {len(data)} bytes')
          PY

      - name: Upload high-tier diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steamforge-high-tier-readability
          path: |
            high-tier-board.png
            high-tier-instrumentation.txt
            emulator.log
          if-no-files-found: warn
          retention-days: 3

      - name: Emulator diagnostics on failure
        if: failure()
        run: |
          echo '=== emulator.log ==='
          tail -400 emulator.log || true
          echo '=== adb devices ==='
          adb devices -l || true
          echo '=== instrumentation ==='
          cat high-tier-instrumentation.txt || true
