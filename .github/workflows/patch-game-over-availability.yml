name: Patch Game Over Availability

on:
  push:
    branches:
      - patch/game-over-availability-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Patch Game Over rewarded availability condition'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: patch/game-over-availability-v1
      - name: Restore original rewarded availability rule
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/steamforge/game/ui/game/GameScreen.kt')
          text = path.read_text()
          old = 'else if (rewardedAvailable && gemsGained > 0) {'
          new = 'else if (rewardedAvailable) {'
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/steamforge/game/ui/game/GameScreen.kt
          git commit -m 'Restore rewarded availability rule'
          git push origin HEAD:patch/game-over-availability-v1
