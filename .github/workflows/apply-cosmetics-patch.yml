              '''                    onExit = { back() },\n                    modifier = Modifier.navigationBarsPadding(),\n                )\n            }\n            entry<Contracts>''',
              '''                    onExit = { back() },\n                    tileSet = cosmeticLoadout.tileSet,\n                    modifier = Modifier.navigationBarsPadding(),\n                )\n            }\n            entry<Contracts>''',
          )
          replace(
