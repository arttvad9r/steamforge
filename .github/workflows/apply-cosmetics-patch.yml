name: Apply Cosmetics Wiring Patch

on:
  push:
    branches:
      - feature/cosmetics
    paths:
      - '.github/workflows/apply-cosmetics-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/cosmetics
          fetch-depth: 0

      - name: Apply targeted cosmetics wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {actual} for {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Gradle: three cosmetic non-consumables live beside Remove Ads.
          replace(
              'app/build.gradle.kts',
              '''val rustoreConsoleAppId = providers.gradleProperty("steamforge.rustoreConsoleAppId").orElse("").get()\nval rustoreRemoveAdsProductId = providers.gradleProperty("steamforge.removeAdsProductId").orElse("").get()\nval rustorePayScheme = providers.gradleProperty("steamforge.rustorePayScheme").orElse("steamforge-pay").get()\nval rustorePayConfigured = rustoreConsoleAppId.isNotBlank() && rustoreRemoveAdsProductId.isNotBlank()''',
              '''val rustoreConsoleAppId = providers.gradleProperty("steamforge.rustoreConsoleAppId").orElse("").get()\nval rustoreRemoveAdsProductId = providers.gradleProperty("steamforge.removeAdsProductId").orElse("").get()\nval rustoreTileCosmeticProductId = providers.gradleProperty("steamforge.tileCosmeticProductId").orElse("").get()\nval rustoreWorkshopCosmeticProductId = providers.gradleProperty("steamforge.workshopCosmeticProductId").orElse("").get()\nval rustoreStarterCosmeticBundleProductId = providers.gradleProperty("steamforge.starterCosmeticBundleProductId").orElse("").get()\nval rustorePayScheme = providers.gradleProperty("steamforge.rustorePayScheme").orElse("steamforge-pay").get()\nval rustorePayConfigured = rustoreConsoleAppId.isNotBlank() && listOf(\n    rustoreRemoveAdsProductId,\n    rustoreTileCosmeticProductId,\n    rustoreWorkshopCosmeticProductId,\n    rustoreStarterCosmeticBundleProductId,\n).all { it.isNotBlank() }''',
          )
          replace(
              'app/build.gradle.kts',
              '''        buildConfigField("String", "RUSTORE_REMOVE_ADS_PRODUCT_ID", quoted(rustoreRemoveAdsProductId))\n        buildConfigField("boolean", "RUSTORE_PAY_CONFIGURED", rustorePayConfigured.toString())''',
              '''        buildConfigField("String", "RUSTORE_REMOVE_ADS_PRODUCT_ID", quoted(rustoreRemoveAdsProductId))\n        buildConfigField("String", "RUSTORE_TILE_COSMETIC_PRODUCT_ID", quoted(rustoreTileCosmeticProductId))\n        buildConfigField("String", "RUSTORE_WORKSHOP_COSMETIC_PRODUCT_ID", quoted(rustoreWorkshopCosmeticProductId))\n        buildConfigField("String", "RUSTORE_STARTER_COSMETIC_BUNDLE_PRODUCT_ID", quoted(rustoreStarterCosmeticBundleProductId))\n        buildConfigField("boolean", "RUSTORE_PAY_CONFIGURED", rustorePayConfigured.toString())''',
          )

          # Production preflight and CI secret guard.
          for array_name in ('sensitive_project_props', 'required_gradle_props'):
              marker = f'''{array_name}=(\n'''
              # The actual insertion is anchored on the existing Remove Ads key inside each array.
          replace(
              'tools/build-rustore-release.sh',
              '''  steamforge.rustoreConsoleAppId\n  steamforge.removeAdsProductId\n  steamforge.rustorePayScheme''',
              '''  steamforge.rustoreConsoleAppId\n  steamforge.removeAdsProductId\n  steamforge.tileCosmeticProductId\n  steamforge.workshopCosmeticProductId\n  steamforge.starterCosmeticBundleProductId\n  steamforge.rustorePayScheme''',
