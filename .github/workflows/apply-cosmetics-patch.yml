              '''    val ads = AdsManager(analytics, isDebug = isDebug)\n    val billing = BillingProviderFactory.create(appContext, appScope, analytics)''',
              '''    val ads = AdsManager(analytics, isDebug = isDebug)\n    val billing = BillingProviderFactory.create(appContext, appScope, analytics)\n    val cosmetics = CosmeticLoadoutStore(appContext)''',
          )

