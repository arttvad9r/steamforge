              '''            entry<WeeklyGame> {\n                val challenge = WeeklyChallenges.forEpochDay(LocalDay.todayEpochDay())''',
              '''            entry<WeeklyGame> {\n                val challenge = WeeklyChallenges.forEpochDay(LocalDay.todayEpochDay())\n                val cosmeticLoadout = effectiveCosmeticLoadout(container)''',
          )
          replace(
