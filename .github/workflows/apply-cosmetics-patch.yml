          )
          replace(
              'tools/build-rustore-release.sh',
              '''[[ "$REMOVE_ADS_PRODUCT_ID" != *[[:space:]]* ]] || fail 'steamforge.removeAdsProductId must not contain whitespace'\n[[ "$RUSTORE_PAY_SCHEME" =~ ^[A-Za-z][A-Za-z0-9+.-]*$ ]] || fail 'steamforge.rustorePayScheme must be a valid URI scheme' ''',
              '''[[ "$REMOVE_ADS_PRODUCT_ID" != *[[:space:]]* ]] || fail 'steamforge.removeAdsProductId must not contain whitespace'\n[[ "$TILE_COSMETIC_PRODUCT_ID" != *[[:space:]]* ]] || fail 'steamforge.tileCosmeticProductId must not contain whitespace'\n[[ "$WORKSHOP_COSMETIC_PRODUCT_ID" != *[[:space:]]* ]] || fail 'steamforge.workshopCosmeticProductId must not contain whitespace'\n[[ "$STARTER_COSMETIC_BUNDLE_PRODUCT_ID" != *[[:space:]]* ]] || fail 'steamforge.starterCosmeticBundleProductId must not contain whitespace'\nPRODUCT_IDS=("$REMOVE_ADS_PRODUCT_ID" "$TILE_COSMETIC_PRODUCT_ID" "$WORKSHOP_COSMETIC_PRODUCT_ID" "$STARTER_COSMETIC_BUNDLE_PRODUCT_ID")\n[[ "$(printf '%s\\n' "${PRODUCT_IDS[@]}" | sort -u | wc -l)" -eq "${#PRODUCT_IDS[@]}" ]] || fail 'RuStore non-consumable product IDs must be unique'\n[[ "$RUSTORE_PAY_SCHEME" =~ ^[A-Za-z][A-Za-z0-9+.-]*$ ]] || fail 'steamforge.rustorePayScheme must be a valid URI scheme' ''',
          )
          replace(
              '.github/workflows/android-ci.yml',
              '''              'steamforge.rustoreConsoleAppId',\n              'steamforge.removeAdsProductId',\n              'steamforge.rustorePayScheme',''',
              '''              'steamforge.rustoreConsoleAppId',\n              'steamforge.removeAdsProductId',\n              'steamforge.tileCosmeticProductId',\n              'steamforge.workshopCosmeticProductId',\n              'steamforge.starterCosmeticBundleProductId',\n              'steamforge.rustorePayScheme',''',
          )

          # App container owns presentation preferences separately from progress and billing.
          replace(
              'app/src/main/java/com/steamforge/game/SteamforgeApp.kt',
              '''import com.steamforge.game.config.FallbackGameConfigProvider\nimport com.steamforge.game.data.OnboardingStore''',
              '''import com.steamforge.game.config.FallbackGameConfigProvider\nimport com.steamforge.game.cosmetics.CosmeticLoadoutStore\nimport com.steamforge.game.data.OnboardingStore''',
          )
          replace(
