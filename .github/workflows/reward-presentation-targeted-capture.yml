name: Reward Presentation Targeted Capture

on:
  push:
    branches:
      - ci/reward-presentation-targeted-capture

permissions:
  contents: read

concurrency:
  group: reward-presentation-targeted-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install emulator packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'emulator' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'system-images;android-36;google_apis;x86_64'

      - name: Expose production Game Over overlay to diagnostic test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/steamforge/game/ui/game/GameScreen.kt')
          text = path.read_text()
          marker = '@Composable\nprivate fun GameOverOverlay('
          assert marker in text
          path.write_text(text.replace(marker, '@Composable\nfun GameOverOverlay(', 1))
          PY

      - name: Build debug and diagnostic APKs
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest

      - name: Boot emulator
        run: |
          set -euxo pipefail
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/16.0/bin/avdmanager" create avd \
            -n reward_presentation_ci \
            -k 'system-images;android-36;google_apis;x86_64' \
            -d pixel_6 \
            --force
          ANDROID_AVD_HOME="$ANDROID_AVD_HOME" nohup "$ANDROID_HOME/emulator/emulator" \
            -avd reward_presentation_ci \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel on \
            > emulator.log 2>&1 &
          echo $! > emulator.pid
          adb start-server
          for i in $(seq 1 120); do
            if adb devices | grep -q '^emulator-.*device$'; then break; fi
            if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then cat emulator.log; exit 1; fi
            sleep 2
          done
          adb devices | grep '^emulator-.*device$'
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then break; fi
            if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then cat emulator.log; exit 1; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

      - name: Install APKs
        run: |
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Capture RewardPresentation shapes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reward-presentation-captures

          capture() {
            local label="$1" size="$2" density="$3" font="$4"
            adb shell wm size "$size"
            adb shell wm density "$density"
            adb shell settings put system font_scale "$font"
            sleep 1
            adb shell am instrument -w -r \
              -e class com.steamforge.game.ui.game.RewardPresentationDiagnosticTest \
              com.steamforge.game.test/androidx.test.runner.AndroidJUnitRunner \
              | tee "reward-presentation-captures/${label}.txt"
            grep -F 'OK (1 test)' "reward-presentation-captures/${label}.txt"
            adb exec-out run-as com.steamforge.game cat cache/reward-presentation.png \
              > "reward-presentation-captures/${label}.png"
            test -s "reward-presentation-captures/${label}.png"
          }

          capture portrait-standard 1080x2400 420 1.0
          capture landscape-640x360 1280x720 320 1.0
          capture landscape-640x360-large-font 1280x720 320 1.3

          adb shell wm size reset || true
          adb shell wm density reset || true
          adb shell settings put system font_scale 1.0 || true

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steamforge-reward-presentation-targeted
          path: |
            reward-presentation-captures/
            emulator.log
          if-no-files-found: warn
          retention-days: 3

      - name: Emulator diagnostics on failure
        if: failure()
        run: |
          tail -400 emulator.log || true
          adb devices -l || true
          adb shell wm size || true
          adb shell wm density || true
