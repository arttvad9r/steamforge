name: Workshop Hero Capture V2

on:
  push:
    branches:
      - diag/workshop-hero-capture-v2

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install emulator packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-36' 'build-tools;36.0.0' 'system-images;android-36;google_apis;x86_64'
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Boot emulator
        run: |
          set -euxo pipefail
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/16.0/bin/avdmanager" create avd -n workshop_v2 -k 'system-images;android-36;google_apis;x86_64' -d pixel_6 --force
          ANDROID_AVD_HOME="$ANDROID_AVD_HOME" nohup "$ANDROID_HOME/emulator/emulator" -avd workshop_v2 -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > emulator.log 2>&1 &
          adb start-server
          for i in $(seq 1 120); do adb devices | grep -q '^emulator-' && break; sleep 2; done
          for i in $(seq 1 120); do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break; sleep 2; done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Install Steamforge
        run: adb install -r app/build/outputs/apk/debug/app-debug.apk
      - name: Capture Workshop
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workshop-captures

          dump_ui() {
            for i in $(seq 1 15); do
              adb shell rm -f /sdcard/window.xml >/dev/null 2>&1 || true
              rm -f /tmp/window.xml
              if adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 && adb pull /sdcard/window.xml /tmp/window.xml >/dev/null 2>&1 && [ -s /tmp/window.xml ]; then return 0; fi
              sleep 2
            done
            return 1
          }

          wait_text() {
            local needle="$1"
            for i in $(seq 1 15); do
              if dump_ui && grep -Fqi "$needle" /tmp/window.xml; then return 0; fi
              sleep 2
            done
            cat /tmp/window.xml || true
            return 1
          }

          tap_node() {
            local needle="$1"
            dump_ui
            python3 -c 'import re,sys,xml.etree.ElementTree as ET; n=sys.argv[1].casefold(); root=ET.parse("/tmp/window.xml").getroot(); parents={c:p for p in root.iter() for c in p}; m=[x for x in root.iter("node") if n in (((x.attrib.get("text") or "")+" "+(x.attrib.get("content-desc") or "")).casefold())]; assert m, n; o=m[0]; node=next((a for a in [o,parents.get(o),parents.get(parents.get(o)) if parents.get(o) is not None else None] if a is not None and a.attrib.get("clickable")=="true"),o); b=re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]",node.attrib.get("bounds","")); assert b; a=list(map(int,b.groups())); print((a[0]+a[2])//2,(a[1]+a[3])//2)' "$needle" > /tmp/tap.txt
            read -r x y < /tmp/tap.txt
            adb shell input tap "$x" "$y"
            sleep 2
          }

          launch_home() {
            adb shell am force-stop com.steamforge.game
            adb shell monkey -p com.steamforge.game -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 3
            if wait_text 'ПРИВАТНОСТЬ'; then
              if grep -Fqi 'ОТКЛЮЧИТЬ' /tmp/window.xml; then tap_node 'ОТКЛЮЧИТЬ'; fi
            fi
            wait_text 'MECHANICAL 2048'
          }

          open_workshop() {
            launch_home
            wait_text 'Мастерская'
            tap_node 'Мастерская'
            wait_text 'УРОВЕНЬ МАСТЕРСКОЙ'
          }

          capture_mode() {
            local name="$1" size="$2" density="$3" font="$4"
            adb shell wm size "$size"
            adb shell wm density "$density"
            adb shell settings put system font_scale "$font"
            open_workshop
            adb exec-out screencap -p > "workshop-captures/workshop-${name}.png"
            test -s "workshop-captures/workshop-${name}.png"
            dump_ui
            cp /tmp/window.xml "workshop-captures/workshop-${name}.xml"
          }

          capture_mode standard 1080x2400 420 1.0
          capture_mode compact 720x1600 320 1.0
          capture_mode large-text 1080x2400 420 1.3
      - name: Upload Workshop captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steamforge-workshop-hero-v2
          path: |
            workshop-captures/
            emulator.log
          if-no-files-found: warn
          retention-days: 3
