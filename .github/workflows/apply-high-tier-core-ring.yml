name: Apply High Tier Core Ring Patch

on:
  push:
    branches:
      - polish/high-tier-core-ring

permissions:
  contents: write

jobs:
  patch-renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace filled high-tier disc with rare core ring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/steamforge/game/ui/game/GameScreen.kt')
          text = path.read_text()
          start_token = 'if (tile.level >= 9) {'
          start = text.find(start_token)
          if start < 0:
              raise SystemExit('High-tier accent start token not found')
          end_token = '\n            }\n'
          end = text.find(end_token, start)
          if end < 0:
              raise SystemExit('High-tier accent end token not found')
          end += len(end_token)
          block = text[start:end]
          alpha_old = 'TealGlow.copy(alpha = if (colors.glow) 0.11f else 0.045f),'
          center_old = '                    center = Offset(size.width / 2f, size.height / 2f),\n                )'
          if alpha_old not in block or center_old not in block:
              raise SystemExit('Expected high-tier accent internals not found')
          replacement = block.replace(start_token, 'if (tile.level >= 11) {', 1)
          replacement = replacement.replace(
              alpha_old,
              'TealGlow.copy(alpha = if (tile.level >= 12) 0.18f else 0.14f),',
              1,
          )
          replacement = replacement.replace(
              center_old,
              '                    center = Offset(size.width / 2f, size.height / 2f),\n'
              '                    style = androidx.compose.ui.graphics.drawscope.Stroke(1.25.dp.toPx()),\n'
              '                )',
              1,
          )
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Commit renderer change
        shell: bash
        run: |
          git config user.name 'steamforge-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/steamforge/game/ui/game/GameScreen.kt
          git diff --cached --check
          git commit -m 'Reduce high-tier core ornament'
          git push origin HEAD:polish/high-tier-core-ring
