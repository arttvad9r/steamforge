name: Workshop Multi Mechanism Targeted Capture

on:
  push:
    branches:
      - ci/workshop-multi-mechanism-targeted
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install emulator packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-36' 'build-tools;36.0.0' 'system-images;android-36;google_apis;x86_64'
      - name: Validate harness and build
        run: |
          bash -n tools/check-workshop-multi-mechanism-capture.sh
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Boot emulator
        run: |
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/avdmanager"
          echo no | "$AVDMANAGER" create avd -n steamforge_workshop_multi_ci -k 'system-images;android-36;google_apis;x86_64' -d pixel_6 --force
          ANDROID_AVD_HOME="$ANDROID_AVD_HOME" nohup "$ANDROID_HOME/emulator/emulator" -avd steamforge_workshop_multi_ci -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on -camera-back none -camera-front none > emulator.log 2>&1 &
          adb start-server
          for i in $(seq 1 120); do adb devices | grep -q '^emulator-' && break; sleep 2; done
          for i in $(seq 1 120); do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ] && break; sleep 2; done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1'
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0.5
          adb shell settings put global transition_animation_scale 0.5
          adb shell settings put global animator_duration_scale 0.5
      - name: Install
        run: adb install -r app/build/outputs/apk/debug/app-debug.apk
      - name: Capture Workshop
        run: bash tools/check-workshop-multi-mechanism-capture.sh
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steamforge-workshop-multi-targeted
          path: |
            ci-workshop-multi-capture/
            emulator.log
          retention-days: 3
      - name: Emulator diagnostics on failure
        if: failure()
        run: |
          tail -300 emulator.log || true
          adb devices -l || true
          adb shell wm size || true
          adb shell wm density || true
