name: Adaptive Gameplay Window Smoke

on:
  pull_request:
    branches:
      - master
      - fix/release-hardening
    paths:
      - 'app/src/main/java/com/steamforge/game/ui/game/**'
      - 'app/src/main/java/com/steamforge/game/ui/home/**'
      - 'app/src/main/java/com/steamforge/game/ui/workshop/**'
      - '.github/workflows/adaptive-window-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adaptive-window-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adaptive-window:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install emulator packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'emulator' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'system-images;android-36;google_apis;x86_64'

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Create and boot emulator
        run: |
          set -euxo pipefail
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/avdmanager"
          echo no | "$AVDMANAGER" create avd \
            -n steamforge_adaptive \
            -k 'system-images;android-36;google_apis;x86_64' \
            -d pixel_6 \
            --force
          ANDROID_AVD_HOME="$ANDROID_AVD_HOME" nohup "$ANDROID_HOME/emulator/emulator" \
            -avd steamforge_adaptive \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel on \
            -camera-back none \
            -camera-front none \
            > emulator.log 2>&1 &
          echo $! > emulator.pid
          adb start-server
          for i in $(seq 1 120); do
            if adb devices | grep -q '^emulator-'; then break; fi
            if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then cat emulator.log; exit 1; fi
            sleep 2
          done
          adb devices | grep '^emulator-'
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then break; fi
            if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then cat emulator.log; exit 1; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0.5
          adb shell settings put global transition_animation_scale 0.5
          adb shell settings put global animator_duration_scale 0.5

      - name: Install Steamforge
        run: adb install -r app/build/outputs/apk/debug/app-debug.apk

      - name: Verify production gameplay across window shapes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-adaptive-window

          launch_app() {
            adb shell am force-stop com.steamforge.game
            adb shell monkey -p com.steamforge.game -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 2
          }

          dump_ui() {
            local label="$1"
            for i in $(seq 1 15); do
              adb shell rm -f /sdcard/window.xml >/dev/null 2>&1 || true
              rm -f /tmp/window.xml /tmp/ui-dump.log
              if adb shell uiautomator dump /sdcard/window.xml > /tmp/ui-dump.log 2>&1 \
                && adb pull /sdcard/window.xml /tmp/window.xml >/dev/null 2>&1 \
                && [ -s /tmp/window.xml ]; then
                cp /tmp/window.xml "ci-adaptive-window/${label}.xml"
                return 0
              fi
              sleep 2
            done
            cat /tmp/ui-dump.log || true
            return 1
          }

          wait_for_text() {
            local needle="$1"
            local label="$2"
            for i in $(seq 1 15); do
              if dump_ui "$label" && grep -Fqi "$needle" /tmp/window.xml; then return 0; fi
              sleep 2
            done
            echo "Text not found: $needle"
            cat /tmp/window.xml || true
            return 1
          }

          tap() {
            local needle="$1"
            local label="$2"
            dump_ui "$label"
            python3 - "$needle" > /tmp/tap.txt <<'PY'
          import re
          import sys
          import xml.etree.ElementTree as ET

          needle = sys.argv[1].casefold()
          root = ET.parse('/tmp/window.xml').getroot()
          parents = {child: parent for parent in root.iter() for child in parent}
          matches = [
              node for node in root.iter('node')
              if needle in (((node.attrib.get('text') or '') + ' ' + (node.attrib.get('content-desc') or '')).casefold())
          ]
          assert matches, f'node not found: {needle}'
          original = matches[0]
          ancestors = [original]
          current = original
          for _ in range(3):
              current = parents.get(current)
              if current is None:
                  break
              ancestors.append(current)
          node = next((candidate for candidate in ancestors if candidate.attrib.get('clickable') == 'true'), original)
          match = re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds', ''))
          assert match, node.attrib
          left, top, right, bottom = map(int, match.groups())
          print((left + right) // 2, (top + bottom) // 2)
          PY
            read -r x y < /tmp/tap.txt
            echo "Tap '$needle' at $x,$y"
            adb shell input tap "$x" "$y"
            sleep 2
          }

          open_workshop() {
            local label="$1"
            for i in $(seq 1 12); do
              dump_ui "$label"
              if grep -Fqi 'ИГРАТЬ' /tmp/window.xml; then return 0; fi
              if grep -Fqi 'content-desc="Мастерская.' /tmp/window.xml; then
                tap 'Мастерская.' "${label}-open"
              fi
              sleep 1
            done
            echo 'Workshop not reachable'
            cat /tmp/window.xml || true
            return 1
          }

          wait_for_tile() {
            local label="$1"
            for i in $(seq 1 15); do
              if dump_ui "$label" && grep -Eqi 'content-desc="(Уголь|Медная шестерня),' /tmp/window.xml; then return 0; fi
              sleep 2
            done
            echo 'Gameplay tile not found'
            cat /tmp/window.xml || true
            return 1
          }

          assert_node_inside_display() {
            local needle="$1"
            local label="$2"
            dump_ui "$label"
            python3 - "$needle" <<'PY'
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          needle = sys.argv[1].casefold()
          root = ET.parse('/tmp/window.xml').getroot()
          matches = [
              node for node in root.iter('node')
              if needle in (((node.attrib.get('text') or '') + ' ' + (node.attrib.get('content-desc') or '')).casefold())
          ]
          assert matches, f'node not found: {needle}'
          node = matches[0]
          match = re.match(r'\[(-?\d+),(-?\d+)\]\[(-?\d+),(-?\d+)\]', node.attrib.get('bounds', ''))
          assert match, node.attrib
          left, top, right, bottom = map(int, match.groups())
          size_text = subprocess.check_output(['adb', 'shell', 'wm', 'size'], text=True)
          sizes = re.findall(r'(\d+)x(\d+)', size_text)
          assert sizes, size_text
          width, height = map(int, sizes[-1])
          assert right > left and bottom > top, node.attrib
          assert left >= 0 and top >= 0, (node.attrib, width, height)
          assert right <= width and bottom <= height, (node.attrib, width, height)
          print(f"'{needle}' inside {width}x{height}: [{left},{top}][{right},{bottom}]")
          PY
          }

          assert_tile_inside_display() {
            local label="$1"
            dump_ui "$label"
            python3 <<'PY'
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          root = ET.parse('/tmp/window.xml').getroot()
          tile = next(
              (
                  node for node in root.iter('node')
                  if re.match(r'^(Уголь|Медная шестерня),\s*\d+$', node.attrib.get('content-desc') or '')
              ),
              None,
          )
          assert tile is not None, 'production gameplay tile not found'
          match = re.match(r'\[(-?\d+),(-?\d+)\]\[(-?\d+),(-?\d+)\]', tile.attrib.get('bounds', ''))
          assert match, tile.attrib
          left, top, right, bottom = map(int, match.groups())
          size_text = subprocess.check_output(['adb', 'shell', 'wm', 'size'], text=True)
          sizes = re.findall(r'(\d+)x(\d+)', size_text)
          assert sizes, size_text
          width, height = map(int, sizes[-1])
          assert right > left and bottom > top, tile.attrib
          assert left >= 0 and top >= 0, (tile.attrib, width, height)
          assert right <= width and bottom <= height, (tile.attrib, width, height)
          print(f"tile inside {width}x{height}: [{left},{top}][{right},{bottom}]")
          PY
          }

          capture() {
            local label="$1"
            adb exec-out screencap -p > "ci-adaptive-window/${label}.png"
            test -s "ci-adaptive-window/${label}.png"
          }

          # First launch establishes privacy/onboarding state.
          adb shell wm size 1080x2400
          adb shell wm density 420
          launch_app
          wait_for_text 'ПРИВАТНОСТЬ' '00-privacy'
          if grep -Fqi 'ОТКЛЮЧИТЬ' /tmp/window.xml; then tap 'ОТКЛЮЧИТЬ' '00-disable-analytics'; fi
          for i in $(seq 1 15); do
            dump_ui '00-post-privacy'
            if grep -Fqi 'ПРОПУСТИТЬ ОБУЧЕНИЕ' /tmp/window.xml; then
              tap 'ПРОПУСТИТЬ ОБУЧЕНИЕ' '00-skip-onboarding'
              break
            fi
            if grep -Fqi 'MECHANICAL 2048' /tmp/window.xml || grep -Fqi 'ИГРАТЬ' /tmp/window.xml; then break; fi
            sleep 2
          done

          verify_shape() {
            local size="$1"
            local density="$2"
            local label="$3"
            adb shell wm size "$size"
            adb shell wm density "$density"
            launch_app
            open_workshop "${label}-workshop"
            tap 'ИГРАТЬ' "${label}-play"
            wait_for_tile "${label}-game"
            assert_node_inside_display 'СЧЁТ:' "${label}-score"
            assert_tile_inside_display "${label}-tile"
            assert_node_inside_display 'ОТМЕНА' "${label}-undo"
            assert_node_inside_display 'КЛЮЧ' "${label}-wrench"
            capture "${label}-game"
            adb shell input keyevent KEYCODE_BACK
            sleep 1
          }

          # 360 x 640 dp, classic 16:9 portrait.
          verify_shape '720x1280' '320' '10-portrait-16x9'

          # 390 x 845 dp, approximately 19.5:9 portrait.
          verify_shape '780x1690' '320' '20-portrait-19_5x9'

          # 640 x 360 dp, classic 16:9 landscape. Critical gameplay controls must remain visible.
          verify_shape '1280x720' '320' '30-landscape-16x9'

      - name: Upload adaptive window diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steamforge-adaptive-window
          path: ci-adaptive-window/
          if-no-files-found: warn
          retention-days: 3

      - name: Emulator diagnostics on failure
        if: failure()
        run: |
          echo '=== emulator.log ==='
          tail -400 emulator.log || true
          echo '=== adb devices ==='
          adb devices -l || true
          echo '=== window ==='
          adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || true
          adb shell uiautomator dump /sdcard/failure-window.xml || true
          adb pull /sdcard/failure-window.xml /tmp/failure-window.xml || true
          cat /tmp/failure-window.xml || true
