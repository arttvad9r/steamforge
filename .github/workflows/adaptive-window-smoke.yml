name: Adaptive Gameplay Window Smoke

on:
  push:
    branches:
      - master
    paths:
      - 'app/src/main/java/com/steamforge/game/ui/game/**'
      - 'tools/check-adaptive-gameplay-window.sh'
      - '.github/workflows/adaptive-window-smoke.yml'
  pull_request:
    paths:
      - 'app/src/main/java/com/steamforge/game/ui/game/**'
      - 'tools/check-adaptive-gameplay-window.sh'
      - '.github/workflows/adaptive-window-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adaptive-window-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adaptive-window:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install emulator packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'emulator' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'system-images;android-36;google_apis;x86_64'

      - name: Validate smoke script and build debug APK
        run: |
          bash -n tools/check-adaptive-gameplay-window.sh
          ./gradlew --no-daemon assembleDebug

      - name: Create and boot emulator
        run: |
          set -euxo pipefail
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/avdmanager"
          echo no | "$AVDMANAGER" create avd \
            -n steamforge_adaptive_ci \
            -k 'system-images;android-36;google_apis;x86_64' \
            -d pixel_6 \
            --force
          ANDROID_AVD_HOME="$ANDROID_AVD_HOME" nohup "$ANDROID_HOME/emulator/emulator" \
            -avd steamforge_adaptive_ci \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel on \
            -camera-back none \
            -camera-front none \
            > emulator.log 2>&1 &
          echo $! > emulator.pid
          adb start-server
          for i in $(seq 1 120); do
            if adb devices | grep -q '^emulator-'; then break; fi
            if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then cat emulator.log; exit 1; fi
            sleep 2
          done
          adb devices | grep '^emulator-'
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then break; fi
            if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then cat emulator.log; exit 1; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0.5
          adb shell settings put global transition_animation_scale 0.5
          adb shell settings put global animator_duration_scale 0.5

      - name: Install Steamforge
        run: adb install -r app/build/outputs/apk/debug/app-debug.apk

      - name: Verify production gameplay across window shapes
        run: bash tools/check-adaptive-gameplay-window.sh

      - name: Upload adaptive window diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steamforge-adaptive-window
          path: |
            ci-adaptive-window/
            emulator.log
          if-no-files-found: warn
          retention-days: 3

      - name: Emulator diagnostics on failure
        if: failure()
        run: |
          echo '=== emulator.log ==='
          tail -400 emulator.log || true
          echo '=== adb devices ==='
          adb devices -l || true
          echo '=== current window ==='
          adb shell wm size || true
          adb shell wm density || true
          echo '=== activity ==='
          adb shell dumpsys activity activities | head -200 || true
