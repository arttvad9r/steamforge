name: Temp Export Game Screen

on:
  push:
    branches:
      - visual/gameplay-board-first-hud

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: game-screen-source
          retention-days: 1
          path: app/src/main/java/com/steamforge/game/ui/game/GameScreen.kt
