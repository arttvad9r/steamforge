name: Temp Apply Game Screen Layout

on:
  push:
    branches:
      - visual/gameplay-board-first-hud

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/gameplay-board-first-hud
      - name: Apply anchored gameplay edit
        shell: bash
        run: |
          if [ "$(git log -1 --pretty=%s)" = "Apply board-first gameplay hierarchy" ]; then
            echo "Generated source commit already applied"
            exit 0
          fi
          python tools/temp_apply_gameplay_layout.py
      - name: Commit source edit
        shell: bash
        run: |
          git config user.name "steamforge-ci"
          git config user.email "steamforge-ci@users.noreply.github.com"
          git add app/src/main/java/com/steamforge/game/ui/game/GameScreen.kt
          if git diff --cached --quiet; then
            echo "No source change to commit"
            exit 0
          fi
          git commit -m "Apply board-first gameplay hierarchy"
          git push origin HEAD:visual/gameplay-board-first-hud
