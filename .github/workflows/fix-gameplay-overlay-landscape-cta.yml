name: Fix Gameplay Overlay Landscape CTA

on:
  push:
    branches:
      - diag/gameplay-overlay-adaptive-cta-fix-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production target
        uses: actions/checkout@v6
        with:
          ref: feat/gameplay-overlay-adaptive-v1
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout patch source
        uses: actions/checkout@v6
        with:
          ref: diag/gameplay-overlay-adaptive-cta-fix-v2
          path: .patch-source
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Stack compact landscape CTAs
        shell: bash
        run: |
          python3 .patch-source/.tmp/fix-landscape-cta.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/steamforge/game/ui/game/GameScreen.kt
          git diff --cached --check
          git commit -m "Stack landscape overlay actions"
          git push origin HEAD:feat/gameplay-overlay-adaptive-v1
