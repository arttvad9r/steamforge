name: PR73 Diagnose

on:
  pull_request:
    paths:
      - 'app/src/main/java/com/steamforge/game/monetization/**'
      - 'app/src/test/java/com/steamforge/game/monetization/**'
      - '.github/workflows/pr73-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: New interstitial policy tests
        id: new_tests
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'com.steamforge.game.monetization.InterstitialSessionPolicyTest'

      - name: All debug unit tests
        id: all_tests
        continue-on-error: true
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint debug
        id: lint_debug
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      - name: Lint release
        id: lint_release
        continue-on-error: true
        run: ./gradlew --no-daemon lintRelease

      - name: Assemble debug
        id: assemble_debug
        continue-on-error: true
        run: ./gradlew --no-daemon assembleDebug

      - name: Assemble release
        id: assemble_release
        continue-on-error: true
        run: ./gradlew --no-daemon assembleRelease

      - name: Require all diagnostics green
        if: always()
        run: |
          echo 'new_tests=${{ steps.new_tests.outcome }}'
          echo 'all_tests=${{ steps.all_tests.outcome }}'
          echo 'lint_debug=${{ steps.lint_debug.outcome }}'
          echo 'lint_release=${{ steps.lint_release.outcome }}'
          echo 'assemble_debug=${{ steps.assemble_debug.outcome }}'
          echo 'assemble_release=${{ steps.assemble_release.outcome }}'
          test '${{ steps.new_tests.outcome }}' = success
          test '${{ steps.all_tests.outcome }}' = success
          test '${{ steps.lint_debug.outcome }}' = success
          test '${{ steps.lint_release.outcome }}' = success
          test '${{ steps.assemble_debug.outcome }}' = success
          test '${{ steps.assemble_release.outcome }}' = success
