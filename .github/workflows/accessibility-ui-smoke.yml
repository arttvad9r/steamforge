name: Accessibility UI Smoke

on:
  push:
    branches:
      - master
    paths:
      - 'app/src/main/java/com/steamforge/game/Navigation.kt'
      - 'app/src/main/java/com/steamforge/game/ui/**'
      - 'app/src/main/java/com/steamforge/game/theme/**'
      - 'app/src/main/java/com/steamforge/game/navigation/**'
      - 'app/src/androidTest/java/com/steamforge/game/WholeAppNavigationSmokeTest.kt'
      - 'tools/check-accessibility-ui.sh'
      - '.github/workflows/accessibility-ui-smoke.yml'
  pull_request:
    paths:
      - 'app/src/main/java/com/steamforge/game/Navigation.kt'
      - 'app/src/main/java/com/steamforge/game/ui/**'
      - 'app/src/main/java/com/steamforge/game/theme/**'
      - 'app/src/main/java/com/steamforge/game/navigation/**'
      - 'app/src/androidTest/java/com/steamforge/game/WholeAppNavigationSmokeTest.kt'
      - 'tools/check-accessibility-ui.sh'
      - '.github/workflows/accessibility-ui-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessibility-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install emulator packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'emulator' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'system-images;android-36;google_apis;x86_64'

      - name: Validate smoke script and build debug/instrumentation APKs
        run: |
          bash -n tools/check-accessibility-ui.sh
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Create and boot emulator
        run: |
          set -euxo pipefail
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/avdmanager"
          echo no | "$AVDMANAGER" create avd \
            -n steamforge_accessibility_ci \
            -k 'system-images;android-36;google_apis;x86_64' \
            -d pixel_6 \
            --force
          ANDROID_AVD_HOME="$ANDROID_AVD_HOME" nohup "$ANDROID_HOME/emulator/emulator" \
            -avd steamforge_accessibility_ci \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel on \
            -camera-back none \
            -camera-front none \
            > emulator.log 2>&1 &
          echo $! > emulator.pid
          adb start-server
          for i in $(seq 1 120); do
            if adb devices | grep -q '^emulator-'; then break; fi
            if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then cat emulator.log; exit 1; fi
            sleep 2
          done
          adb devices | grep '^emulator-'
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then break; fi
            if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then cat emulator.log; exit 1; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0.5
          adb shell settings put global transition_animation_scale 0.5
          adb shell settings put global animator_duration_scale 0.5

      - name: Install Steamforge and instrumentation
        run: |
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Verify large-font targets and safe bounds
        run: bash tools/check-accessibility-ui.sh

      - name: Verify unlocked meta semantics at large font
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            adb shell settings put system font_scale 1.0 >/dev/null 2>&1 || true
            adb shell wm size reset >/dev/null 2>&1 || true
            adb shell wm density reset >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          adb shell wm size 1080x2400
          adb shell wm density 420
          adb shell settings put system font_scale 1.3
          actual_scale="$(adb shell settings get system font_scale | tr -d '\r')"
          python3 - "$actual_scale" <<'PY'
          import math
          import sys
          actual = float(sys.argv[1])
          assert math.isclose(actual, 1.3, rel_tol=0, abs_tol=0.01), actual
          PY

          adb shell am force-stop com.steamforge.game
          adb shell am instrument -w -r \
            -e class com.steamforge.game.WholeAppNavigationSmokeTest \
            com.steamforge.game.test/androidx.test.runner.AndroidJUnitRunner \
            | tee meta-large-font-instrumentation.txt
          grep -F 'OK (1 test)' meta-large-font-instrumentation.txt

      - name: Upload accessibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steamforge-accessibility-ui
          path: |
            ci-accessibility-ui/
            meta-large-font-instrumentation.txt
            emulator.log
          if-no-files-found: warn
          retention-days: 3

      - name: Emulator diagnostics on failure
        if: failure()
        run: |
          echo '=== emulator.log ==='
          tail -400 emulator.log || true
          echo '=== adb devices ==='
          adb devices -l || true
          echo '=== display ==='
          adb shell wm size || true
          adb shell wm density || true
          echo '=== font scale ==='
          adb shell settings get system font_scale || true
          echo '=== large-font meta instrumentation ==='
          cat meta-large-font-instrumentation.txt || true
          echo '=== activity ==='
          adb shell dumpsys activity activities | head -200 || true
