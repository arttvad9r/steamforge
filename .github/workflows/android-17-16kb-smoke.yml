name: Android 17 16 KB Smoke

on:
  pull_request:
    branches:
      - master
    paths:
      - 'app/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'app/src/main/**'
      - 'tools/check-android-16kb.sh'
      - '.github/workflows/android-17-16kb-smoke.yml'
  push:
    branches:
      - master
    paths:
      - 'app/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'app/src/main/**'
      - 'tools/check-android-16kb.sh'
      - '.github/workflows/android-17-16kb-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android17-16kb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 16 KB emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 \
            'platform-tools' \
            'emulator' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'system-images;android-37.0;google_apis_ps16k;x86_64'

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Boot Android 17 16 KB emulator
        run: |
          set -euxo pipefail
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android17-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/avdmanager"
          test -x "$AVDMANAGER"
          echo no | "$AVDMANAGER" create avd \
            -n steamforge_android17_16kb \
            -k 'system-images;android-37.0;google_apis_ps16k;x86_64' \
            -d pixel_6 \
            --force
          AVD_CONFIG="$ANDROID_AVD_HOME/steamforge_android17_16kb.avd/config.ini"
          test -f "$AVD_CONFIG"
          printf '\ndisk.dataPartition.size=4G\nhw.ramSize=3072\n' >> "$AVD_CONFIG"
          ANDROID_AVD_HOME="$ANDROID_AVD_HOME" nohup "$ANDROID_HOME/emulator/emulator" \
            -avd steamforge_android17_16kb \
            -memory 3072 \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel on \
            -camera-back none \
            -camera-front none \
            > emulator-android17.log 2>&1 &
          echo $! > emulator-android17.pid
          adb start-server
          for i in $(seq 1 120); do
            if adb devices | grep -q '^emulator-.*device$'; then break; fi
            if ! kill -0 "$(cat emulator-android17.pid)" 2>/dev/null; then cat emulator-android17.log; exit 1; fi
            sleep 2
          done
          adb devices | grep '^emulator-.*device$'
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then break; fi
            if ! kill -0 "$(cat emulator-android17.pid)" 2>/dev/null; then cat emulator-android17.log; exit 1; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"

          # API 37 preview images can report sys.boot_completed before framework services are ready.
          for i in $(seq 1 60); do
            package_service="$(adb shell service check package 2>/dev/null | tr -d '\r' || true)"
            window_service="$(adb shell service check window 2>/dev/null | tr -d '\r' || true)"
            if [[ "$package_service" == *found* && "$window_service" == *found* ]]; then break; fi
            if ! kill -0 "$(cat emulator-android17.pid)" 2>/dev/null; then cat emulator-android17.log; exit 1; fi
            sleep 2
          done
          adb shell service check package | grep -q 'found'
          adb shell service check window | grep -q 'found'

          # Fresh preview images continue first-boot provisioning after framework services appear.
          # Wait for the setup flags, then leave enough time for GMS/system startup pressure to settle.
          for i in $(seq 1 30); do
            device_provisioned="$(adb shell settings get global device_provisioned 2>/dev/null | tr -d '\r' || true)"
            user_setup_complete="$(adb shell settings get secure user_setup_complete 2>/dev/null | tr -d '\r' || true)"
            echo "Provisioning flags: device=$device_provisioned user=$user_setup_complete"
            if [ "$device_provisioned" = "1" ] && [ "$user_setup_complete" = "1" ]; then break; fi
            sleep 2
          done
          sleep 45
          adb shell df -h /data
          adb shell dumpsys meminfo | head -40 || true

      - name: Verify Android 17 and 16 KB runtime
        run: |
          set -euxo pipefail
          api_level="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          page_size="$(adb shell getconf PAGE_SIZE | tr -d '\r')"
          echo "API level: $api_level"
          echo "Page size: $page_size"
          test "$api_level" -ge 37
          test "$page_size" = '16384'

      - name: Install and launch Steamforge
        run: |
          set -euxo pipefail
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb logcat -c

          wait_for_resumed() {
            for i in $(seq 1 30); do
              pid="$(adb shell pidof com.steamforge.game 2>/dev/null | tr -d '\r' || true)"
              resumed="$(adb shell dumpsys activity activities 2>/dev/null | grep -F 'ResumedActivity:' | grep -F 'com.steamforge.game/.MainActivity' || true)"
              if [ -n "$pid" ] && [ -n "$resumed" ]; then
                echo "Steamforge resumed with pid $pid"
                return 0
              fi
              sleep 1
            done
            return 1
          }

          launch_once() {
            adb shell am force-stop com.steamforge.game
            adb shell am start -W -n com.steamforge.game/.MainActivity
            wait_for_resumed
          }

          if ! launch_once; then
            echo 'First launch was interrupted; allowing preview provisioning to settle before one retry.'
            sleep 15
            launch_once
          fi

          # Require the process/activity to remain healthy after launch. If preview provisioning interrupts
          # the first stable state, permit one final explicit restart, then require stability again.
          sleep 5
          if ! wait_for_resumed; then
            echo 'Foreground process was interrupted after launch; performing final bounded restart.'
            sleep 10
            launch_once
            sleep 5
            wait_for_resumed
          fi

          # Fail on an actual Java crash from Steamforge even if Android subsequently restarts the activity.
          if adb logcat -d -v brief | grep -E 'FATAL EXCEPTION|Process: com\.steamforge\.game' | grep -q 'com.steamforge.game'; then
            echo 'Steamforge fatal exception detected.'
            adb logcat -d -v brief | grep -E -A40 -B10 'FATAL EXCEPTION|Process: com\.steamforge\.game' || true
            exit 1
          fi

      - name: Emulator diagnostics on failure
        if: failure()
        run: |
          echo '=== Android 17 emulator log ==='
          tail -400 emulator-android17.log || true
          echo '=== device ==='
          adb devices -l || true
          adb shell getprop ro.build.version.release || true
          adb shell getprop ro.build.version.sdk || true
          adb shell getconf PAGE_SIZE || true
          adb shell df -h /data || true
          echo '=== provisioning ==='
          adb shell settings get global device_provisioned || true
          adb shell settings get secure user_setup_complete || true
          echo '=== services ==='
          adb shell service check package || true
          adb shell service check window || true
          echo '=== process ==='
          adb shell pidof com.steamforge.game || true
          echo '=== activity ==='
          adb shell dumpsys activity activities | grep -F 'com.steamforge.game' || true
          echo '=== focused window ==='
          adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || true
          echo '=== recent logcat ==='
          adb logcat -d -v brief | tail -600 || true
