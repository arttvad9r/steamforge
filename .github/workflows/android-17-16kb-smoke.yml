name: Android 17 16 KB Smoke

on:
  pull_request:
    branches:
      - master
    paths:
      - 'app/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'app/src/main/**'
      - 'tools/check-android-16kb.sh'
      - '.github/workflows/android-17-16kb-smoke.yml'
  push:
    branches:
      - master
    paths:
      - 'app/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'app/src/main/**'
      - 'tools/check-android-16kb.sh'
      - '.github/workflows/android-17-16kb-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android17-16kb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 16 KB emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 \
            'platform-tools' \
            'emulator' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'system-images;android-37.0;google_apis_ps16k;x86_64'

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Boot Android 17 16 KB emulator
        run: |
          set -euxo pipefail
          ls -l /dev/kvm
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android17-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/avdmanager"
          test -x "$AVDMANAGER"
          echo no | "$AVDMANAGER" create avd \
            -n steamforge_android17_16kb \
            -k 'system-images;android-37.0;google_apis_ps16k;x86_64' \
            -d pixel_6 \
            --force
          AVD_CONFIG="$ANDROID_AVD_HOME/steamforge_android17_16kb.avd/config.ini"
          test -f "$AVD_CONFIG"
          printf '\ndisk.dataPartition.size=4G\nhw.ramSize=3072\n' >> "$AVD_CONFIG"
          ANDROID_AVD_HOME="$ANDROID_AVD_HOME" nohup "$ANDROID_HOME/emulator/emulator" \
            -avd steamforge_android17_16kb \
            -memory 3072 \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel on \
            -camera-back none \
            -camera-front none \
            > emulator-android17.log 2>&1 &
          echo $! > emulator-android17.pid
          adb start-server

          for i in $(seq 1 120); do
            if adb devices | grep -q '^emulator-.*device$'; then break; fi
            if ! kill -0 "$(cat emulator-android17.pid)" 2>/dev/null; then
              cat emulator-android17.log
              exit 1
            fi
            sleep 2
          done
          adb devices | grep '^emulator-.*device$'

          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then break; fi
            if ! kill -0 "$(cat emulator-android17.pid)" 2>/dev/null; then
              cat emulator-android17.log
              exit 1
            fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"

          # Preview images may publish sys.boot_completed before core framework services settle.
          stable=0
          for i in $(seq 1 60); do
            package_service="$(adb shell service check package 2>/dev/null | tr -d '\r' || true)"
            window_service="$(adb shell service check window 2>/dev/null | tr -d '\r' || true)"
            activity_service="$(adb shell service check activity 2>/dev/null | tr -d '\r' || true)"
            if [ "$package_service" = 'Service package: found' ] && \
               [ "$window_service" = 'Service window: found' ] && \
               [ "$activity_service" = 'Service activity: found' ]; then
              stable=$((stable + 1))
              if [ "$stable" -ge 5 ]; then break; fi
            else
              stable=0
            fi
            sleep 2
          done
          test "$stable" -ge 5

          # Give first-boot provisioning a bounded chance to finish before package installation.
          for i in $(seq 1 30); do
            device_provisioned="$(adb shell settings get global device_provisioned 2>/dev/null | tr -d '\r' || true)"
            user_setup_complete="$(adb shell settings get secure user_setup_complete 2>/dev/null | tr -d '\r' || true)"
            echo "Provisioning flags: device=$device_provisioned user=$user_setup_complete"
            if [ "$device_provisioned" = "1" ] && [ "$user_setup_complete" = "1" ]; then break; fi
            sleep 2
          done
          sleep 30
          adb shell df -h /data

      - name: Verify Android 17 and 16 KB runtime
        run: |
          set -euxo pipefail
          api_level="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          page_size="$(adb shell getconf PAGE_SIZE | tr -d '\r')"
          echo "API level: $api_level"
          echo "Page size: $page_size"
          test "$api_level" -ge 37
          test "$page_size" = '16384'

      - name: Install and launch Steamforge
        run: |
          set -euxo pipefail

          system_server_pid() {
            adb shell pidof system_server 2>/dev/null | tr -d '\r' | awk '{print $1}'
          }

          wait_for_framework() {
            local stable=0
            local candidate_pid=""
            local current_pid=""
            for i in $(seq 1 120); do
              current_pid="$(system_server_pid || true)"
              package_service="$(adb shell service check package 2>/dev/null | tr -d '\r' || true)"
              window_service="$(adb shell service check window 2>/dev/null | tr -d '\r' || true)"
              activity_service="$(adb shell service check activity 2>/dev/null | tr -d '\r' || true)"
              boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"

              if [ -n "$current_pid" ] && \
                 [ "$boot_completed" = '1' ] && \
                 [ "$package_service" = 'Service package: found' ] && \
                 [ "$window_service" = 'Service window: found' ] && \
                 [ "$activity_service" = 'Service activity: found' ]; then
                if [ "$current_pid" = "$candidate_pid" ]; then
                  stable=$((stable + 1))
                else
                  candidate_pid="$current_pid"
                  stable=1
                fi
                if [ "$stable" -ge 10 ]; then
                  echo "Android framework pid $candidate_pid stable for 20 seconds."
                  return 0
                fi
              else
                candidate_pid=""
                stable=0
              fi

              if ! kill -0 "$(cat emulator-android17.pid)" 2>/dev/null; then
                cat emulator-android17.log
                return 1
              fi
              sleep 2
            done
            echo 'Android framework did not become stable.'
            return 1
          }

          package_visible() {
            adb shell pm path com.steamforge.game 2>/dev/null | tr -d '\r' | grep -q '^package:'
          }

          wait_for_package() {
            for i in $(seq 1 30); do
              if package_visible; then return 0; fi
              sleep 1
            done
            return 1
          }

          install_once() {
            adb install -r app/build/outputs/apk/debug/app-debug.apk
          }

          app_is_foreground() {
            local activity_dump
            local window_dump
            activity_dump="$(adb shell dumpsys activity activities 2>/dev/null | tr -d '\r' || true)"
            window_dump="$(adb shell dumpsys window windows 2>/dev/null | tr -d '\r' || true)"

            # Android versions use different labels for the resumed activity. Accept the known
            # foreground representations, but always require the Steamforge package itself.
            if printf '%s\n' "$activity_dump" \
              | grep -E 'ResumedActivity|topResumedActivity|mResumedActivity' \
              | grep -Fq 'com.steamforge.game'; then
              return 0
            fi

            if printf '%s\n' "$window_dump" \
              | grep -E 'mCurrentFocus|mFocusedApp' \
              | grep -Fq 'com.steamforge.game'; then
              return 0
            fi

            return 1
          }

          wait_for_foreground() {
            for i in $(seq 1 45); do
              pid="$(adb shell pidof com.steamforge.game 2>/dev/null | tr -d '\r' || true)"
              if [ -n "$pid" ] && app_is_foreground; then
                echo "Steamforge is foreground with pid $pid"
                return 0
              fi
              sleep 1
            done
            return 1
          }

          wait_for_framework
          if ! install_once; then
            echo 'Install interrupted; retrying after framework recovery.'
            wait_for_framework
            install_once
          fi
          wait_for_package

          adb logcat -c
          adb shell am force-stop com.steamforge.game

          # Prefer an explicit launch; fall back to the launcher intent if the preview image
          # rejects the shorthand component form during transient Package Manager recovery.
          if ! adb shell am start -W -n com.steamforge.game/.MainActivity; then
            wait_for_framework
            wait_for_package
            adb shell monkey -p com.steamforge.game -c android.intent.category.LAUNCHER 1
          fi

          if ! wait_for_foreground; then
            echo 'Foreground state was not observed; retrying once through the launcher intent.'
            wait_for_framework
            wait_for_package
            adb shell am force-stop com.steamforge.game
            adb shell monkey -p com.steamforge.game -c android.intent.category.LAUNCHER 1
            wait_for_foreground
          fi

          sleep 5
          pid="$(adb shell pidof com.steamforge.game 2>/dev/null | tr -d '\r' || true)"
          test -n "$pid"
          app_is_foreground

          adb logcat -d -v brief > /tmp/steamforge-logcat.txt
          if grep -Fq 'Process: com.steamforge.game' /tmp/steamforge-logcat.txt; then
            echo 'Steamforge fatal process crash detected.'
            grep -F -A40 -B10 'Process: com.steamforge.game' /tmp/steamforge-logcat.txt || true
            exit 1
          fi

      - name: Emulator diagnostics on failure
        if: failure()
        run: |
          echo '=== Android 17 emulator log ==='
          tail -400 emulator-android17.log || true
          echo '=== device ==='
          adb devices -l || true
          adb shell getprop ro.build.version.release || true
          adb shell getprop ro.build.version.sdk || true
          adb shell getconf PAGE_SIZE || true
          adb shell df -h /data || true
          echo '=== provisioning ==='
          adb shell settings get global device_provisioned || true
          adb shell settings get secure user_setup_complete || true
          echo '=== framework ==='
          adb shell pidof system_server || true
          adb shell getprop sys.boot_completed || true
          echo '=== services ==='
          adb shell service check package || true
          adb shell service check window || true
          adb shell service check activity || true
          echo '=== package ==='
          adb shell pm path com.steamforge.game || true
          echo '=== process ==='
          adb shell pidof com.steamforge.game || true
          echo '=== activity ==='
          adb shell dumpsys activity activities | grep -F 'com.steamforge.game' || true
          echo '=== focused window ==='
          adb shell dumpsys window windows | grep -E 'mCurrentFocus|mFocusedApp|com.steamforge.game' || true
          echo '=== recent logcat ==='
          adb logcat -d -v brief | tail -600 || true
