name: Player Profile Targeted Capture

on:
  pull_request:
    branches: [master]
    paths:
      - 'app/src/main/java/com/steamforge/game/Navigation.kt'
      - 'app/src/main/java/com/steamforge/game/data/SteamforgeRepository.kt'
      - 'app/src/main/java/com/steamforge/game/progression/PermanentProfile.kt'
      - 'app/src/main/java/com/steamforge/game/progression/Progression.kt'
      - 'app/src/main/java/com/steamforge/game/ui/profile/**'
      - 'app/src/main/java/com/steamforge/game/ui/workshop/WorkshopViewModel.kt'
      - 'app/src/androidTest/java/com/steamforge/game/PlayerProfileStateTest.kt'
      - 'tools/check-player-profile-capture.sh'
      - '.github/workflows/player-profile-targeted.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Validate capture script
        run: bash -n tools/check-player-profile-capture.sh
      - name: Install emulator packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-36' 'build-tools;36.0.0' 'system-images;android-36;google_apis;x86_64'
      - name: Build app and validation instrumentation
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Boot emulator
        run: |
          set -euxo pipefail
          sudo chmod 666 /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/avdmanager"
          echo no | "$AVDMANAGER" create avd -n steamforge_profile_ci -k 'system-images;android-36;google_apis;x86_64' -d pixel_6 --force
          ANDROID_AVD_HOME="$ANDROID_AVD_HOME" nohup "$ANDROID_HOME/emulator/emulator" \
            -avd steamforge_profile_ci -no-window -noaudio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel on -camera-back none -camera-front none > emulator.log 2>&1 &
          echo $! > emulator.pid
          adb start-server
          for i in $(seq 1 120); do
            adb devices | grep -q '^emulator-' && break
            kill -0 "$(cat emulator.pid)" 2>/dev/null || { cat emulator.log; exit 1; }
            sleep 2
          done
          adb devices | grep '^emulator-'
          for i in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ] && break
            kill -0 "$(cat emulator.pid)" 2>/dev/null || { cat emulator.log; exit 1; }
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1'
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0.5
          adb shell settings put global transition_animation_scale 0.5
          adb shell settings put global animator_duration_scale 0.5
      - name: Install app and instrumentation
        run: |
          adb install -r -t app/build/outputs/apk/debug/app-debug.apk
          adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Capture player profile
        run: bash tools/check-player-profile-capture.sh
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steamforge-player-profile-targeted
          path: |
            ci-player-profile-capture/
            emulator.log
          if-no-files-found: warn
          retention-days: 3
