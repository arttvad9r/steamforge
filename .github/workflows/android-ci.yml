name: Android CI

on:
  push:
    branches:
      - master
      - fix/release-hardening
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches:
      - master
      - fix/release-hardening
    paths-ignore:
      - 'docs/**'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android 36 packages
        shell: bash
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify release tooling and privacy guard
        shell: bash
        run: |
          bash -n tools/build-rustore-release.sh
          bash -n tools/check-android-16kb.sh
          bash -n tools/check-release-aab.sh
          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          android = '{http://schemas.android.com/apk/res/android}'
          root = ET.parse('app/src/main/AndroidManifest.xml').getroot()
          matches = [
              node for node in root.findall('./application/meta-data')
              if node.get(android + 'name') == 'com.yandex.mobile.ads.AUTOMATIC_SDK_INITIALIZATION'
          ]
          if len(matches) != 1 or matches[0].get(android + 'value') != 'false':
              raise SystemExit('Yandex Mobile Ads automatic initialization must stay disabled')

          tracked_gradle = Path('gradle.properties').read_text(encoding='utf-8')
          sensitive = (
              'steamforge.appmetricaApiKey',
              'steamforge.privacyPolicyUrl',
              'steamforge.rewardedAdUnitId',
              'steamforge.interstitialAdUnitId',
              'steamforge.rustoreConsoleAppId',
              'steamforge.removeAdsProductId',
              'steamforge.tileCosmeticProductId',
              'steamforge.workshopCosmeticProductId',
              'steamforge.starterCosmeticBundleProductId',
              'steamforge.rustorePayScheme',
          )
          leaked = [
              key for key in sensitive
              if re.search(rf'^\s*{re.escape(key)}\s*=', tracked_gradle, re.MULTILINE)
          ]
          if leaked:
              raise SystemExit('Production properties must not be committed: ' + ', '.join(leaked))
          PY

      - name: Verify debug and release code
        run: ./gradlew testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Verify 16 KB release APK
        run: bash tools/check-android-16kb.sh

      - name: Build release app bundle
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      - name: Validate release app bundle
        run: bash tools/check-release-aab.sh
